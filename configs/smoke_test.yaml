# Quick run to check the environment + pipeline (a few minutes). DO NOT use it to report results.
model_name: "roberta-base"
tokenizer_name: "roberta-base"
num_labels: 19
max_len: 64

precision: "bf16"
gradient_checkpointing: false
use_single_split: false

cv:
  n_splits: 2
  start_fold: 0
  skip_if_checkpoint_exists: false

text_features:
  include_lang: true
  include_class_id: true
  template: "[{lang}] {class_id} | {sentence}"

peft:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: ["query", "key", "value", "dense"]

loss_type: "asl"
loss_params:
  gamma_pos: 0
  gamma_neg: 4
  clip: 0.05

sampler:
  enabled: true
  type: "weighted"
  smooth_eps: 1e-3

train_params:
  batch_size: 16
  eval_batch_size: 32
  grad_accum: 1
  epochs: 1
  lr: 0.00005
  scheduler: "cosine"
  warmup: 0.10
  weight_decay: 0.01
  seed: 42
  num_workers: 2

data:
  raw_path: "data/raw/sentences.csv"
  processed_path: "data/processed/"
  expand_to_19_classes: true
  label_list:
    # 7 Java
    - summary_java
    - pointer
    - deprecation
    - rational
    - ownership
    - usage_java
    - expand_java
    # 5 Python
    - summary_python
    - parameters
    - usage_python
    - developmentnotes
    - expand_python
    # 7 Pharo
    - keymessages
    - intent
    - classreferences
    - example
    - keyimplementationpoints
    - responsibilities
    - collaborators

eval:
  metrics: ["precision", "recall", "f1", "roc_auc", "pr_auc"]
  threshold_search: true

logging:
  output_dir: "runs/smoke_test"
  save_best: true
  early_stop: 1
  tensorboard: false

final_training:
  enabled: false
